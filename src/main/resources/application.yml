spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: website-backend
  data:
    mongodb:
      uri: ${MONGO_URL}

app:
  security:
    jwt:
      secret-key: ${SECRET_KEY}
      algorithm: ${ALGORITHM}
      expiration-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES}
  frontend-url: ${FRONTEND_URL}