version: "3.9"

services:
  api:
    build: .
    container_name: fastapi_app
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped   # ✅ add this

  worker:
    build: .
    container_name: pubsub_worker
    command: python -m app.workers.email_worker
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped   # ✅ THIS is the important one